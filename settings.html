<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./Styles/settings-style.css" />
  </head>
  <body>
    <!-- Search Bar -->
    <form class="center">
      <input
        type="text"
        placeholder="Search Settings 🔎"
        id="settings-search"
      />
    </form>

    <!-- Acordian section -->
    <div class="accordion text-center" id="accordionExample">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseOne"
            aria-expanded="true"
            aria-controls="collapseOne">Account</button>
        </h2>
        <div
          id="collapseOne"
          class="accordion-collapse collapse show"
          data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <button onclick="passwordInput()" class="settingSubOption">Change Password</button>
            <button onclick="premiumOptions()" class="settingSubOption">Premium</button>
            <button onclick="notificationOptions()" class="settingSubOption">Notifications</button>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseTwo"
            aria-expanded="false"
            aria-controls="collapseTwo">Playlists</button>
        </h2>
        <div
          id="collapseTwo"
          class="accordion-collapse collapse"
          data-bs-parent="#accordionExample">
          <div class="accordion-body">
              <button onclick="genericOptionsAlert()" class="settingSubOption">Create New Playlist</button>
              <button onclick="genericOptionsAlert()" class="settingSubOption">View Playlists</button>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseThree"
            aria-expanded="false"
            aria-controls="collapseThree"
          >
            Social
          </button>
        </h2>
        <div
          id="collapseThree"
          class="accordion-collapse collapse"
          data-bs-parent="#accordionExample"
        >
          <div class="accordion-body">
            <button onclick="genericOptionsAlert()" class="settingSubOption">View Friends</button>
            <button onclick="genericOptionsAlert()" class="settingSubOption">View Artists Followed</button>
          </div>
        </div>
      </div>
    </div>

    <!-- "Music Player" graphic-->
    <section id="music-player">
      <p class="song-name">Song Name</p>
      <p class="artist-name">Artist Name</p>
      <div class="music-player-details">
        <img src="./icons/Music.png" alt="music symbol" />
        <img src="./icons/progress-bar.png" alt="song progress bar" />
        <img src="./icons/Play circle.png" alt="music player controls" />
      </div>
    </section>


    <!-- Nav buttons at bottom of screen -->
    <nav class="nav nav-pills flex-row justify-content-between flex-sm-row" id="bottom-nav">
      <a
        class="flex-sm-fill text-sm-center nav-link"
        href="#"
        ><img src="./icons/Home.png" alt="home"
      /></a>
      <a class="flex-sm-fill text-sm-center nav-link" href="#"
        ><img src="./icons/Search.png" alt="search"
      /></a>
      <a class="flex-sm-fill text-sm-center nav-link" href="#"
        ><img src="./icons/Book.png" alt="playlists"
      /></a>
      <a class="flex-sm-fill text-sm-center nav-link" href="#"><img src="./icons/account_circle.png" alt="account"/></a>
    </nav>
  </body>

  <!-- Script section-->
   <script>
      function passwordInput() {
        prompt("Enter new password:");
      }

      function premiumOptions() {
        alert("Premium options coming soon!");
      }

      function notificationOptions() {
        alert("Notification settings coming soon!");
      }

      function genericOptionsAlert() {
        alert("This feature is coming soon!");
      }
   </script>
</html>
